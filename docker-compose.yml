services:
  dispatcharr-ma-bridge:
    image: ghcr.io/iceman73/iptv-music-assistant-bridge:latest
    build:
      context: .
      args:
        BASE_IMAGE: ${BASE_IMAGE:-mirror.gcr.io/library/python:3.12-slim}
    container_name: dispatcharr-ma-bridge
    restart: unless-stopped
    ports:
      - "8088:8088"
    env_file:
      - .env
    volumes:
      - bridge-data:/data

volumes:
  bridge-data:
